# Render Blueprint — render.com > New > Blueprint > chon repo nay.
# Render doc file nay va tu tao web service; chi hoi nhung bien danh dau sync: false.
services:
  - type: web
    name: nhatanh-backend
    runtime: docker
    rootDir: backend
    plan: free                      # ngu sau 15 phut; doi sang starter khi can luon-chay
    region: singapore
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: server
      - key: JAVA_OPTS
        value: -Xmx320m               # goi free 512 MB RAM
      - key: DB_URL                   # tu Neon, dang jdbc:postgresql://...?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true           # Render tu sinh chuoi ngau nhien, khong ai phai go
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD           # mat khau tam, chu shop doi trong /admin
        sync: false
      - key: ADMIN_NAME
        value: Nhật Anh
      - key: CORS_ORIGINS             # sua thanh domain Netlify that sau buoc 4
        value: https://nhatanh.netlify.app
      - key: MEDIA_PUBLIC_BASE_URL
        value: https://nhatanh.netlify.app/media
      - key: APP_DEMO_CUSTOMER_ENABLED
        value: "false"
