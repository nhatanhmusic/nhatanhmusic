# Giu backend khong ngu trong gio mo cua.
#
# Render goi free cho ngu sau 15 phut khong ai dung; danh thuc mat ~3 phut.
# Viec nay goi /actuator/health moi 5 phut de may chu luon san sang.
#
# CHI chay 7h-23h gio Viet Nam, khong chay 24/7 — vi Render chi cho 750 gio
# chay moi thang cho ca workspace. Ping 24/7 la ~744 gio, cham tran: mot lan
# deploy lai la vuot, va vuot thi Render TREO web toi dau thang sau.
# 16 gio/ngay ~ 500 gio/thang, du rong.
#
# Khi da chuyen sang goi tra tien (Render Starter hoac Railway), xoa file nay.

name: Giữ backend không ngủ

on:
  schedule:
    # Cron cua GitHub tinh theo gio UTC. Viet Nam = UTC+7, nen 0-15 UTC = 7h-23h VN.
    - cron: '*/5 0-15 * * *'
  workflow_dispatch:        # cho phep bam chay tay de thu

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi health check
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 120 \
              https://nhatanh-backend.onrender.com/actuator/health) && true
            echo "Lần $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 30
          done
          # Khong lam workflow that bai: backend dang khoi dong lai cung tra ve loi,
          # bao that bai chi tao email nhieu chu khong sua duoc gi.
          echo "Chưa gọi được sau 3 lần — có thể máy chủ đang khởi động lại."
