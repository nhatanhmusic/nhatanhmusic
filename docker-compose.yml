services:
  db:
    image: postgres:16-alpine
    container_name: nhatanh-db
    environment:
      POSTGRES_DB: nhatanh
      POSTGRES_USER: nhatanh
      POSTGRES_PASSWORD: nhatanh
    ports:
      - "5433:5432"
    volumes:
      - nhatanh-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhatanh -d nhatanh"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  nhatanh-pgdata:
